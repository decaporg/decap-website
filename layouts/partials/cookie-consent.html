<div id="cookie-consent" class="cookie-consent" hidden>
  <div class="cookie-consent__panel" role="dialog" aria-live="polite" aria-label="Cookie preferences">
    <p class="cookie-consent__text">
      We use analytics scripts that help us understand how visitors use this site. These aren't loaded until you accept. See our <a href="/privacy/">Privacy &amp; Cookies Policy</a> for details.
    </p>
    <div class="cookie-consent__actions">
      <button type="button" class="cookie-consent__btn cookie-consent__btn--reject" id="cookie-consent-reject">Reject</button>
      <button type="button" class="cookie-consent__btn cookie-consent__btn--accept" id="cookie-consent-accept">Accept</button>
    </div>
  </div>
</div>
