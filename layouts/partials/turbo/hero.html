{{ $hero := .Params.hero }}

<div class="turbo-hero">
  <div class="container">
    {{ with $hero.badge }}
      <div class="turbo-hero__badge">{{ partial "icon" "turbo-star" }} {{ . }}</div>
    {{ end }}

    <h1 class="hero-title">{{ .Title }}</h1>
    <p class="lead">{{ .Description }}</p>

    {{ with $hero.cta }}
      <div class="turbo-hero__actions">
        {{ with .primary }}
          <a href="{{ .href }}" class="button button--secondary-white-bg">{{ .text }}</a>
        {{ end }}
        {{ with .secondary }}
          <a href="{{ .href }}" class="button button--text-white">{{ .text }}</a>
        {{ end }}
      </div>
    {{ end }}
  </div>
</div>
