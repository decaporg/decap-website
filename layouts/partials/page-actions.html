{{- /* Copy or view the Markdown copy of a docs page, for pasting into an AI assistant. See /docs/working-with-ai/. */ -}}
{{- with .OutputFormats.Get "markdown" }}
  <button type="button" class="page-actions__copy" data-markdown-url="{{ .RelPermalink }}">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
    <span aria-live="polite">Copy as Markdown</span>
  </button>
  <a href="{{ .RelPermalink }}" type="text/markdown">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8"/></svg>
    View as Markdown
  </a>
{{- end }}
